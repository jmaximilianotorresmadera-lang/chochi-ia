<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>El Chicho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: una sola columna de chat tipo taller, cabecera fija arriba, compositor fijo abajo */
:root {
  --bg: #f3f4f8; --panel: #ffffff; --ink: #1b1d2a; --muted: #5d6178; --line: #d9dbe6;
  --accent: #e0662b; --accent-ink: #ffffff; --user: #e6e9f6;
  --code-bg: #1e2030; --code-ink: #e4e6f2; --code-line: #2e3147;
  --k: #ff9e64; --s: #a6d98a; --c: #8a8fb0; --n: #f2c766; --f: #7fb8ff; --t: #c9a3ff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131c; --panel: #1a1c28; --ink: #e8e9f2; --muted: #9a9db5; --line: #2b2e40;
  --accent: #ff7a3d; --accent-ink: #1a0d05; --user: #23263a;
  --code-bg: #0d0e15; --code-ink: #e4e6f2; --code-line: #262838; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12131c; --panel: #1a1c28; --ink: #e8e9f2; --muted: #9a9db5; --line: #2b2e40;
  --accent: #ff7a3d; --accent-ink: #1a0d05; --user: #23263a;
  --code-bg: #0d0e15; --code-ink: #e4e6f2; --code-line: #262838; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); display: flex; flex-direction: column; }
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font: 800 18px var(--display); flex: none; }
.brand { min-width: 0; flex: 1; }
.brand h1 { margin: 0; font: 800 20px/1.1 var(--display); letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-actions { display: flex; gap: 8px; align-items: center; }
select, .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.ghost:hover { border-color: var(--accent); }

main { flex: 1; overflow-y: auto; }
.thread { max-width: 860px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 18px; }

.msg { display: flex; gap: 10px; min-width: 0; }
.msg .who { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  font: 700 12px var(--mono); background: var(--user); color: var(--muted); }
.msg.bot .who { background: var(--accent); color: var(--accent-ink); }
.bubble { min-width: 0; flex: 1; }
.msg.user .bubble { background: var(--user); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; word-wrap: break-word; }
.bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
.bubble h3, .bubble h4 { font: 700 16px var(--display); margin: 14px 0 6px; }
.bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
.bubble :not(pre) > code { font: 13px var(--mono); background: var(--user); padding: 1px 5px; border-radius: 4px; }
.tag { display: inline-block; font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
.thinking { color: var(--muted); font-style: italic; }
.thinking::after { content: "▍"; animation: blink 1s steps(1) infinite; font-style: normal; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.note { color: var(--muted); font-size: 13px; margin-top: 6px; }
.err { color: #d9443a; font-size: 13.5px; margin-top: 6px; }

.code { margin: 10px 0; border-radius: 10px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 14px;
  border-bottom: 1px solid var(--code-line); font: 600 11.5px var(--mono); color: #8a8fb0; text-transform: lowercase; }
.copy { background: transparent; border: 1px solid var(--code-line); color: #c8cbe0; border-radius: 6px; padding: 3px 9px; font: 600 11.5px var(--mono); }
.copy:hover { border-color: var(--accent); color: #fff; }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
.code code { font: 13px/1.55 var(--mono); color: var(--code-ink); white-space: pre; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--k); }
.hljs-string, .hljs-regexp { color: var(--s); }
.hljs-comment { color: var(--c); font-style: italic; }
.hljs-number { color: var(--n); }
.hljs-title, .hljs-function .hljs-title, .hljs-title.function_ { color: var(--f); }
.hljs-type, .hljs-class .hljs-title, .hljs-attr, .hljs-attribute, .hljs-tag, .hljs-name { color: var(--t); }
.hljs-meta, .hljs-params { color: #c8cbe0; }

.starter { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.starter button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
.starter button:hover { border-color: var(--accent); }
.starter b { display: block; font: 600 11px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.starter span { font-size: 13.5px; }

footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; min-width: 0; resize: none; max-height: 200px; min-height: 44px; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14.5px/1.5 var(--body); }
textarea:focus { outline: none; border-color: var(--accent); }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 0 18px; height: 44px; font-weight: 600; }
.send:disabled { opacity: .5; cursor: default; }
.hint { max-width: 860px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding-top: 18vh; }
.empty b { display: block; font: 800 28px var(--display); color: var(--ink); margin-bottom: 4px; }
@media (max-width: 520px) { .brand p { display: none; } .hdr-actions .ghost span { display: none; } }
@media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; } }
</style>

</head>
<body>
<header>
  <div class="logo" aria-hidden="true">Ch</div>
  <div class="brand">
    <h1>El Chicho</h1>
    <p>Todos los lenguajes · Diccionario · Explicaciones</p>
  </div>
  <div class="hdr-actions">
    <select id="mode" aria-label="Modo">
      <option value="auto">Auto</option>
      <option value="code">Código</option>
      <option value="dict">Diccionario</option>
      <option value="explain">Explicar</option>
    </select>
    <select id="tier" aria-label="Modelo">
      <option value="default">Normal</option>
      <option value="complex" selected>Máximo</option>
      <option value="quick">Rápido</option>
    </select>
    <button class="ghost" id="reset" title="Nuevo chat">＋<span> Nuevo</span></button>
  </div>
</header>

<main id="scroller">
  <div class="thread" id="thread"></div>
</main>

<footer>
  <form class="composer" id="form">
    <textarea id="box" rows="1" placeholder="Pídele código a El Chicho… (Enter envía, Shift+Enter salto de línea)"></textarea>
    <button class="send" id="send" type="submit">Enviar</button>
  </form>
  <div class="hint" id="hint"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/arduino.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elixir.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/delphi.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/fortran.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/julia.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/clojure.min.js"></script>
<script src="app.js"></script>
</body>
</html>
